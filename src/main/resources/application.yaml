spring:
  application:
    name: displayu-backend
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${app.environment:default}
    distribution:
      slo:
        http.server.requests: 100ms,300ms,1s,3s

app:
  display:
    invitation:
      base-url: https://www.displayu.co.kr/display/invitation

  kakao:
    client:
      id: ${KAKAO_CLIENT_ID}
      secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}

  google:
    client:
      id: ${GOOGLE_CLIENT_ID}
      secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

  oauth:
    cookie-secure: ${OAUTH_COOKIE_SECURE:false}
