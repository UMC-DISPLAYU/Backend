spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  environment: local
  display:
    invitation:
      base-url: ${DISPLAY_INVITATION_BASE_URL:https://www.displayu.co.kr/display/invitation}
  kakao:
    client:
      id: ${KAKAO_CLIENT_ID}
      secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: http://localhost:8080/api/v1/auth/kakao/callback
  google:
    client:
      id: ${GOOGLE_CLIENT_ID}
      secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: http://localhost:8080/api/v1/auth/google/callback
  oauth:
    cookie-secure: false
  file:
    storage:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET}
      cdn-base-url: ${CDN_BASE_URL}
      presigned-url-expiration-seconds: ${PRESIGNED_URL_EXPIRATION_SECONDS:3600}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:7200000}
  signup-expiration: ${JWT_SIGNUP_EXPIRATION:600000}


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    doc-expansion: list
    display-request-duration: true

frontend:
  base-url: http://localhost:5173
  allowed-origins: http://localhost:5173,https://www.displayu.co.kr,https://display-frontend-five.vercel.app
