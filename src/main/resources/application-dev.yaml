spring:
  application:
    name: demo

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:DisplayU}
    username: ${DB_USERNAME:DisplayUser}
    password: ${DB_PASSWORD:displayu2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
