spring:
  datasource:
    url: jdbc:h2:mem:displayu_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@test.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 0

frontend:
  base-url: https://www.displayu.co.kr
  allowed-origins: http://localhost:5173,https://www.displayu.co.kr,https://display-frontend-five.vercel.app


app:
  environment: test
  display:
    invitation:
      base-url: https://www.displayu.co.kr/display/invitation

  kakao:
    client:
      id: test-kakao-client-id
      secret: test-kakao-client-secret
    redirect-uri: http://localhost:8080/api/v1/auth/kakao/callback

  google:
    client:
      id: test-google-client-id
      secret: test-google-client-secret
    redirect-uri: http://localhost:8080/api/v1/auth/google/callback

  oauth:
    cookie-secure: false


jwt:
  secret: test-secret-test-secret-test-secret-test-secret
  access-expiration: 3600000
  refresh-expiration: 1209600000
  signup-expiration: 600000
