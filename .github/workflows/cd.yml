name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'displayu-backend' }}
  APP_PORT: ${{ secrets.APP_PORT || '8080' }}
  EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
  MYSQL_IMAGE: ${{ secrets.MYSQL_IMAGE || 'mysql:8.0' }}
  FLYWAY_IMAGE: ${{ secrets.FLYWAY_IMAGE || 'flyway/flyway:11' }}
  TEMP_DB_NAME: displayu_migration_precheck
  APPLICATION_JAR: build/libs/demo-0.0.1-SNAPSHOT.jar
  PRODUCTION_DB_TUNNEL_PORT: "13306"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply code format
        run: ./gradlew spotlessApply --no-daemon

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Verify Flyway migrations in JAR
        run: jar tf "$APPLICATION_JAR" | grep 'db/migration' | sort

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: ${{ env.APPLICATION_JAR }}
          if-no-files-found: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

  migration-precheck:
    name: Migration precheck
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: migration-changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base_ref="${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            base_ref="HEAD~1"
          else
            base_ref=""
          fi

          if [ -z "$base_ref" ]; then
            changed="true"
          elif git diff --name-only "$base_ref" HEAD -- 'src/main/resources/db/migration/V*.sql' \
            | grep -q .; then
            changed="true"
          else
            changed="false"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Download application JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: application-jar
          path: build/libs

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$EC2_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Mask production DB values
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          {
            echo "::add-mask::$DB_HOST"
            echo "::add-mask::$DB_PORT"
            echo "::add-mask::$DB_NAME"
            echo "::add-mask::$DB_USERNAME"
            echo "::add-mask::$DB_PASSWORD"
            echo "::add-mask::jdbc:mysql://$DB_HOST:$DB_PORT/$DB_NAME"
          }

      - name: Protect versioned migration files
        run: |
          set -euo pipefail

          mkdir -p /tmp/flyway-protect

          git fetch --no-tags origin dev:refs/remotes/origin/dev || true

          if git rev-parse --verify origin/dev >/dev/null 2>&1; then
            git ls-tree -r --name-only origin/dev -- 'src/main/resources/db/migration/V*.sql' \
              | sort > /tmp/flyway-protect/protected-files.txt
          else
            : > /tmp/flyway-protect/protected-files.txt
          fi

          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base_ref="${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            base_ref="HEAD~1"
          else
            base_ref=""
          fi

          if [ -n "$base_ref" ]; then
            git ls-tree -r --name-only "$base_ref" -- 'src/main/resources/db/migration/V*.sql' \
              | sort -u >> /tmp/flyway-protect/protected-files.txt
          fi

          sort -u /tmp/flyway-protect/protected-files.txt -o /tmp/flyway-protect/protected-files.txt

          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if [ ! -f "$file" ]; then
              echo "::error file=$file::Existing versioned Flyway migration was deleted. Add a new migration instead."
              failed=1
              continue
            fi

            if ! git diff --quiet origin/dev -- "$file" 2>/dev/null; then
              if git cat-file -e "origin/dev:$file" 2>/dev/null; then
                echo "::error file=$file::Existing versioned Flyway migration was modified after it existed on dev. Add a new migration instead."
                failed=1
              fi
            fi

            if [ -n "$base_ref" ] && ! git diff --quiet "$base_ref" -- "$file" 2>/dev/null; then
              if git cat-file -e "$base_ref:$file" 2>/dev/null; then
                echo "::error file=$file::Existing versioned Flyway migration was modified after it existed on the deployment base. Add a new migration instead."
                failed=1
              fi
            fi
          done < /tmp/flyway-protect/protected-files.txt

          while IFS= read -r file; do
            name="$(basename "$file")"
            if ! [[ "$name" =~ ^V[0-9]+__[A-Za-z0-9_]+\.sql$ ]]; then
              echo "::error file=$file::Migration filename must match V<digits>__<description>.sql using letters, numbers, and underscores."
              failed=1
            fi
          done < <(find src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' | sort)

          find src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' \
            | sed -n 's|.*/V\([0-9][0-9]*\)__.*\.sql|\1|p' \
            | sort > /tmp/flyway-protect/current-versions.txt

          duplicates="$(uniq -d /tmp/flyway-protect/current-versions.txt || true)"
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate Flyway migration version(s): $duplicates"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Detect risky migration SQL
        id: migration-risk
        if: steps.migration-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          pattern='DROP[[:space:]]+(TABLE|DATABASE|SCHEMA|VIEW|INDEX|FOREIGN[[:space:]]+KEY|COLUMN)|ALTER[[:space:]]+TABLE[^;]*(DROP|CHANGE[[:space:]]+(COLUMN[[:space:]]+)?|MODIFY[[:space:]]+(COLUMN[[:space:]]+)?|ALTER[[:space:]]+COLUMN)|ADD[[:space:]]+COLUMN[^;]*NOT[[:space:]]+NULL|MODIFY[[:space:]]+(COLUMN[[:space:]]+)?|CHANGE[[:space:]]+(COLUMN[[:space:]]+)?|ALTER[[:space:]]+COLUMN|ADD[[:space:]]+UNIQUE|ADD[[:space:]]+(CONSTRAINT[[:space:]]+[^[:space:]]+[[:space:]]+)?FOREIGN[[:space:]]+KEY|(^|[[:space:];])DELETE[[:space:]]+FROM|TRUNCATE'

          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base_ref="${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            base_ref="HEAD~1"
          else
            base_ref=""
          fi

          if [ -n "$base_ref" ]; then
            mapfile -t changed_migration_files < <(
              git diff --name-only "$base_ref" HEAD -- 'src/main/resources/db/migration/V*.sql' \
                | sort
            )
          else
            mapfile -t changed_migration_files < <(
              find src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' | sort
            )
          fi

          if [ "${#changed_migration_files[@]}" -eq 0 ]; then
            matches=""
          else
            matches="$(grep -Ein "$pattern" "${changed_migration_files[@]}" || true)"
          fi

          if [ -n "$matches" ]; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
          else
            echo "risky=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Migration risk scan"
            if [ -n "$matches" ]; then
              echo
              echo "Risky DDL/DML was detected. Full production-schema migration precheck is required and is running in this job."
              echo
              echo '```text'
              echo "$matches"
              echo '```'
            else
              echo
              echo "No configured risky DDL/DML pattern was detected. Full production-schema migration precheck still runs before production migration."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start temporary MySQL
        if: steps.migration-changes.outputs.changed == 'true' && steps.migration-risk.outputs.risky == 'true'
        run: |
          set -euo pipefail

          docker run -d \
            --name migration-precheck-mysql \
            -e MYSQL_ROOT_PASSWORD=precheck-root-password \
            -e MYSQL_DATABASE="$TEMP_DB_NAME" \
            -p 3307:3306 \
            "$MYSQL_IMAGE"

          for attempt in $(seq 1 60); do
            if mysqladmin ping \
              --host=127.0.0.1 \
              --port=3307 \
              --user=root \
              --password=precheck-root-password \
              --silent; then
              exit 0
            fi
            sleep 2
          done

          docker logs migration-precheck-mysql || true
          exit 1

      - name: Dump production schema and Flyway history
        if: steps.migration-changes.outputs.changed == 'true' && steps.migration-risk.outputs.risky == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          MYSQL_PWD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/flyway-precheck

          ssh -i ~/.ssh/deploy_key \
            -p "$EC2_PORT" \
            -o ExitOnForwardFailure=yes \
            -N \
            -L "$PRODUCTION_DB_TUNNEL_PORT:$DB_HOST:$DB_PORT" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" &
          tunnel_pid="$!"
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if mysqladmin ping \
              --host=127.0.0.1 \
              --port="$PRODUCTION_DB_TUNNEL_PORT" \
              --user="$DB_USERNAME" \
              --silent; then
              tunnel_ready=1
              break
            fi
            sleep 1
          done
          if [ "${tunnel_ready:-0}" -ne 1 ]; then
            echo "::error::Could not connect to production DB through EC2 SSH tunnel."
            exit 1
          fi

          mysqldump \
            --host=127.0.0.1 \
            --port="$PRODUCTION_DB_TUNNEL_PORT" \
            --user="$DB_USERNAME" \
            --no-data \
            --routines \
            --triggers \
            --events \
            --single-transaction \
            --set-gtid-purged=OFF \
            --skip-comments \
            "$DB_NAME" \
            > /tmp/flyway-precheck/production-schema.sql

          mysqldump \
            --host=127.0.0.1 \
            --port="$PRODUCTION_DB_TUNNEL_PORT" \
            --user="$DB_USERNAME" \
            --no-create-info \
            --skip-triggers \
            --single-transaction \
            --set-gtid-purged=OFF \
            --skip-comments \
            "$DB_NAME" flyway_schema_history \
            > /tmp/flyway-precheck/flyway-schema-history.sql

          sed -E -i 's/DEFINER=`[^`]+`@`[^`]+`//g' /tmp/flyway-precheck/production-schema.sql

      - name: Restore production schema into temporary MySQL
        if: steps.migration-changes.outputs.changed == 'true' && steps.migration-risk.outputs.risky == 'true'
        run: |
          set -euo pipefail

          mysql \
            --host=127.0.0.1 \
            --port=3307 \
            --user=root \
            --password=precheck-root-password \
            --execute="DROP DATABASE IF EXISTS \`$TEMP_DB_NAME\`; CREATE DATABASE \`$TEMP_DB_NAME\` CHARACTER SET utf8mb4;"

          mysql --host=127.0.0.1 --port=3307 --user=root --password=precheck-root-password "$TEMP_DB_NAME" \
            < /tmp/flyway-precheck/production-schema.sql

          mysql --host=127.0.0.1 --port=3307 --user=root --password=precheck-root-password "$TEMP_DB_NAME" \
            < /tmp/flyway-precheck/flyway-schema-history.sql

      - name: Check Flyway migration order against production DB
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          MYSQL_PWD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key \
            -p "$EC2_PORT" \
            -o ExitOnForwardFailure=yes \
            -N \
            -L "$PRODUCTION_DB_TUNNEL_PORT:$DB_HOST:$DB_PORT" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" &
          tunnel_pid="$!"
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if mysqladmin ping \
              --host=127.0.0.1 \
              --port="$PRODUCTION_DB_TUNNEL_PORT" \
              --user="$DB_USERNAME" \
              --silent; then
              tunnel_ready=1
              break
            fi
            sleep 1
          done
          if [ "${tunnel_ready:-0}" -ne 1 ]; then
            echo "::error::Could not connect to production DB through EC2 SSH tunnel."
            exit 1
          fi

          mapfile -t applied_versions < <(
            mysql \
              --host=127.0.0.1 \
              --port="$PRODUCTION_DB_TUNNEL_PORT" \
              --user="$DB_USERNAME" \
              --database="$DB_NAME" \
              --batch \
              --skip-column-names \
              --execute="SELECT version FROM flyway_schema_history WHERE success = 1 AND version IS NOT NULL ORDER BY version"
          )

          if [ "${#applied_versions[@]}" -eq 0 ]; then
            echo "No successful Flyway migration history found. Skipping migration order check."
            exit 0
          fi

          latest_applied_version="${applied_versions[-1]}"
          printf '%s\n' "${applied_versions[@]}" | sort > /tmp/applied-flyway-versions.txt

          find src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' \
            | sed -n 's|.*V\([0-9][0-9]*\)__.*\.sql|\1|p' \
            | sort -u > /tmp/resolved-flyway-versions.txt

          failed=0
          while IFS= read -r resolved_version; do
            if [ "$resolved_version" \< "$latest_applied_version" ] \
              && ! grep -Fxq "$resolved_version" /tmp/applied-flyway-versions.txt; then
              echo "::error::Resolved Flyway migration $resolved_version is older than latest applied production migration $latest_applied_version, but it is not applied to production DB."
              failed=1
            fi
          done < /tmp/resolved-flyway-versions.txt

          if [ "$failed" -ne 0 ]; then
            echo "Create a new migration with a version greater than $latest_applied_version instead of adding an older unapplied migration."
            exit 1
          fi

          echo "Flyway migration order check passed. Latest applied production migration: $latest_applied_version"

      - name: Run Flyway validate and migrate on temporary DB
        if: steps.migration-changes.outputs.changed == 'true' && steps.migration-risk.outputs.risky == 'true'
        env:
          FLYWAY_URL: jdbc:mysql://127.0.0.1:3307/displayu_migration_precheck
          FLYWAY_USER: root
          FLYWAY_PASSWORD: precheck-root-password
        run: |
          set -euo pipefail

          docker run --rm --network host \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v "$PWD/src/main/resources/db/migration:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" -ignoreMigrationPatterns="*:pending" validate

          set +e
          docker run --rm --network host \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v "$PWD/src/main/resources/db/migration:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" migrate 2>&1 | tee /tmp/flyway-precheck/flyway-migrate.log
          flyway_status="${PIPESTATUS[0]}"
          set -e

          if [ "$flyway_status" -ne 0 ]; then
            failed_migration="$(grep -Eo 'V[0-9]+__[A-Za-z0-9_]+\.sql' /tmp/flyway-precheck/flyway-migrate.log | tail -1 || true)"
            {
              echo "## Migration precheck failed"
              echo
              echo "- Failed migration: ${failed_migration:-unknown}"
              echo
              echo '```text'
              tail -80 /tmp/flyway-precheck/flyway-migrate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$flyway_status"
          fi

      - name: Verify Spring Boot context and Hibernate schema validation
        if: steps.migration-changes.outputs.changed == 'true' && steps.migration-risk.outputs.risky == 'true'
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_FLYWAY_ENABLED: "false"
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SERVER_PORT: "0"
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"
          DB_NAME: displayu_migration_precheck
          DB_USERNAME: root
          DB_PASSWORD: precheck-root-password
          MAIL_USERNAME: precheck@example.com
          MAIL_PASSWORD: precheck
          GOOGLE_CLIENT_ID: precheck-google-client-id
          GOOGLE_CLIENT_SECRET: precheck-google-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:8080/api/auth/google/callback
          KAKAO_CLIENT_ID: precheck-kakao-client-id
          KAKAO_CLIENT_SECRET: precheck-kakao-client-secret
          KAKAO_REDIRECT_URI: http://localhost:8080/api/auth/kakao/callback
          FRONTEND_BASE_URL: https://www.displayu.co.kr
          JWT_SECRET: precheck-jwt-secret-precheck-jwt-secret-precheck-jwt-secret
          AWS_REGION: ap-northeast-2
          S3_BUCKET: precheck-bucket
          CDN_BASE_URL: https://cdn.example.com
          PRESIGNED_URL_EXPIRATION_SECONDS: "3600"
        run: |
          set -euo pipefail

          set +e
          timeout 75s java -jar "$APPLICATION_JAR" > /tmp/flyway-precheck/spring-boot.log 2>&1
          app_status="$?"
          set -e

          if grep -q 'Started DemoApplication' /tmp/flyway-precheck/spring-boot.log; then
            echo "Spring Boot context startup and Hibernate ddl-auto=validate passed."
            exit 0
          fi

          {
            echo "## Spring Boot schema validation failed"
            echo
            echo '```text'
            tail -120 /tmp/flyway-precheck/spring-boot.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$app_status"

  production-migrate:
    name: Production migrate
    runs-on: ubuntu-latest
    needs: migration-precheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$EC2_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Mask production DB values
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          {
            echo "::add-mask::$DB_HOST"
            echo "::add-mask::$DB_PORT"
            echo "::add-mask::$DB_NAME"
            echo "::add-mask::$DB_USERNAME"
            echo "::add-mask::$DB_PASSWORD"
            echo "::add-mask::jdbc:mysql://$DB_HOST:$DB_PORT/$DB_NAME"
          }

      - name: Run Flyway migration on production DB
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          MYSQL_PWD: ${{ secrets.DB_PASSWORD }}
          FLYWAY_URL: jdbc:mysql://127.0.0.1:${{ env.PRODUCTION_DB_TUNNEL_PORT }}/${{ secrets.DB_NAME }}
          FLYWAY_USER: ${{ secrets.DB_USERNAME }}
          FLYWAY_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key \
            -p "$EC2_PORT" \
            -o ExitOnForwardFailure=yes \
            -N \
            -L "$PRODUCTION_DB_TUNNEL_PORT:$DB_HOST:$DB_PORT" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" &
          tunnel_pid="$!"
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if mysqladmin ping \
              --host=127.0.0.1 \
              --port="$PRODUCTION_DB_TUNNEL_PORT" \
              --user="$DB_USERNAME" \
              --silent; then
              tunnel_ready=1
              break
            fi
            sleep 1
          done
          if [ "${tunnel_ready:-0}" -ne 1 ]; then
            echo "::error::Could not connect to production DB through EC2 SSH tunnel."
            exit 1
          fi

          docker run --rm --network host \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v "$PWD/src/main/resources/db/migration:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" -ignoreMigrationPatterns="*:pending" validate

          set +e
          docker run --rm --network host \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v "$PWD/src/main/resources/db/migration:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" migrate 2>&1 | tee /tmp/production-flyway-migrate.log
          flyway_status="${PIPESTATUS[0]}"
          set -e

          if [ "$flyway_status" -ne 0 ]; then
            failed_migration="$(grep -Eo 'V[0-9]+__[A-Za-z0-9_]+\.sql' /tmp/production-flyway-migrate.log | tail -1 || true)"
            {
              echo "## Production migration failed"
              echo
              echo "- Failed migration: ${failed_migration:-unknown}"
              echo
              echo '```text'
              tail -80 /tmp/production-flyway-migrate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$flyway_status"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build
      - production-migrate

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$EC2_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare runtime env file
        env:
          RUNTIME_SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE || 'dev' }}
          RUNTIME_DB_HOST: ${{ secrets.DB_HOST }}
          RUNTIME_DB_PORT: ${{ secrets.DB_PORT }}
          RUNTIME_DB_NAME: ${{ secrets.DB_NAME }}
          RUNTIME_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          RUNTIME_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RUNTIME_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          RUNTIME_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

          RUNTIME_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          RUNTIME_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RUNTIME_GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          RUNTIME_KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          RUNTIME_KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          RUNTIME_KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          RUNTIME_FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://www.displayu.co.kr' }}
          RUNTIME_OAUTH_COOKIE_SECURE: ${{ secrets.OAUTH_COOKIE_SECURE || 'true' }}
          RUNTIME_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RUNTIME_JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          RUNTIME_JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          RUNTIME_JWT_SIGNUP_EXPIRATION: ${{ secrets.JWT_SIGNUP_EXPIRATION }}
          RUNTIME_AWS_REGION: ${{ secrets.AWS_REGION }}
          RUNTIME_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          RUNTIME_CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          RUNTIME_PRESIGNED_URL_EXPIRATION_SECONDS: ${{ secrets.PRESIGNED_URL_EXPIRATION_SECONDS || '3600' }}
        run: |
          {
            printf 'SPRING_PROFILES_ACTIVE=%s\n' "$RUNTIME_SPRING_PROFILES_ACTIVE"
            printf 'SPRING_FLYWAY_ENABLED=false\n'
            printf 'SPRING_JPA_HIBERNATE_DDL_AUTO=validate\n'
            printf 'DB_HOST=%s\n' "$RUNTIME_DB_HOST"
            printf 'DB_PORT=%s\n' "$RUNTIME_DB_PORT"
            printf 'DB_NAME=%s\n' "$RUNTIME_DB_NAME"
            printf 'DB_USERNAME=%s\n' "$RUNTIME_DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$RUNTIME_DB_PASSWORD"
            printf 'MAIL_USERNAME=%s\n' "$RUNTIME_MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n' "$RUNTIME_MAIL_PASSWORD"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$RUNTIME_GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$RUNTIME_GOOGLE_CLIENT_SECRET"
            printf 'GOOGLE_REDIRECT_URI=%s\n' "$RUNTIME_GOOGLE_REDIRECT_URI"
            printf 'KAKAO_CLIENT_ID=%s\n' "$RUNTIME_KAKAO_CLIENT_ID"
            printf 'KAKAO_CLIENT_SECRET=%s\n' "$RUNTIME_KAKAO_CLIENT_SECRET"
            printf 'KAKAO_REDIRECT_URI=%s\n' "$RUNTIME_KAKAO_REDIRECT_URI"
            printf 'FRONTEND_BASE_URL=%s\n' "$RUNTIME_FRONTEND_BASE_URL"
            printf 'OAUTH_COOKIE_SECURE=%s\n' "$RUNTIME_OAUTH_COOKIE_SECURE"
            printf 'JWT_SECRET=%s\n' "$RUNTIME_JWT_SECRET"
            printf 'JWT_ACCESS_EXPIRATION=%s\n' "$RUNTIME_JWT_ACCESS_EXPIRATION"
            printf 'JWT_REFRESH_EXPIRATION=%s\n' "$RUNTIME_JWT_REFRESH_EXPIRATION"
            printf 'JWT_SIGNUP_EXPIRATION=%s\n' "$RUNTIME_JWT_SIGNUP_EXPIRATION"
            printf 'AWS_REGION=%s\n' "$RUNTIME_AWS_REGION"
            printf 'S3_BUCKET=%s\n' "$RUNTIME_S3_BUCKET"
            printf 'CDN_BASE_URL=%s\n' "$RUNTIME_CDN_BASE_URL"
            printf 'PRESIGNED_URL_EXPIRATION_SECONDS=%s\n' "$RUNTIME_PRESIGNED_URL_EXPIRATION_SECONDS"
          } > .env.deploy

      - name: Copy runtime env file to EC2
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/displayu-backend"
          scp -i ~/.ssh/deploy_key -P "$EC2_PORT" .env.deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/displayu-backend/.env"
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "chmod 600 ~/displayu-backend/.env"

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "set -euo pipefail

             # Required deployment values
             APP_DIR=\"\$HOME/displayu-backend\"
             ENV_FILE=\"\$APP_DIR/.env\"
             ECR_REPOSITORY=\"$ECR_REPOSITORY\"
             IMAGE_TAG=\"$IMAGE_TAG\"
             CONTAINER_NAME=\"$CONTAINER_NAME\"
             APP_PORT=\"$APP_PORT\"
             ECR_ACCOUNT_ID=\$(aws sts get-caller-identity --query Account --output text)
             ECR_REGISTRY=\"\$ECR_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com\"
             IMAGE_URI=\"\$ECR_REGISTRY/\$ECR_REPOSITORY:\$IMAGE_TAG\"

             # Validate EC2 prerequisites
             if [ -z \"\$ECR_REPOSITORY\" ]; then
               echo \"ECR_REPOSITORY is empty.\"
               exit 1
             fi
             if [ -z \"\$IMAGE_TAG\" ]; then
               echo \"IMAGE_TAG is empty.\"
               exit 1
             fi
             if [ ! -f \"\$ENV_FILE\" ]; then
               echo \"Runtime env file is missing: \$ENV_FILE\"
               exit 1
             fi
             if ! command -v docker >/dev/null 2>&1; then
               echo \"docker command is not installed on EC2.\"
               exit 1
             fi
             if ! command -v aws >/dev/null 2>&1; then
               echo \"aws command is not installed on EC2.\"
               exit 1
             fi

             echo \"Deploying image \$IMAGE_URI\"

             # Login to ECR from EC2
             aws ecr get-login-password --region \"$AWS_REGION\" \
               | docker login --username AWS --password-stdin \"\$ECR_REGISTRY\"

             # Pull the image built by this workflow
             docker pull \"\$IMAGE_URI\"

             # Replace the running container
             if docker ps -a --format '{{.Names}}' | grep -Fxq \"\$CONTAINER_NAME\"; then
               docker stop \"\$CONTAINER_NAME\" >/dev/null 2>&1 || true
               docker rm \"\$CONTAINER_NAME\" >/dev/null 2>&1 || true
             fi

             # Start the new application container with Flyway disabled.
             docker run -d \
               --name \"\$CONTAINER_NAME\" \
               --restart unless-stopped \
               --env-file \"\$ENV_FILE\" \
               -p \"\$APP_PORT:8080\" \
               \"\$IMAGE_URI\"

             # Verify the new container starts and stays healthy/running
             success_count=0
             max_attempts=12
             for attempt in \$(seq 1 \"\$max_attempts\"); do
               status=\$(docker inspect -f '{{.State.Status}}' \"\$CONTAINER_NAME\" 2>/dev/null || echo missing)
               health=\$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \"\$CONTAINER_NAME\" 2>/dev/null || echo missing)

               echo \"Container check \$attempt/\$max_attempts: status=\$status health=\$health\"

               if [ \"\$status\" = \"running\" ] && { [ \"\$health\" = \"healthy\" ] || [ \"\$health\" = \"none\" ]; }; then
                 success_count=\$((success_count + 1))
                 if [ \"\$success_count\" -ge 2 ]; then
                   docker image prune -f >/dev/null
                   docker ps --filter \"name=\$CONTAINER_NAME\"
                   exit 0
                 fi
               else
                 success_count=0
               fi

               if [ \"\$status\" = \"exited\" ] || [ \"\$status\" = \"dead\" ] || [ \"\$status\" = \"missing\" ]; then
                 echo \"Container failed during startup. Recent logs:\"
                 docker logs --tail 120 \"\$CONTAINER_NAME\" || true
                 exit 1
               fi

               sleep 5
             done

             echo \"Container did not become stable before timeout. Recent logs:\"
             docker logs --tail 120 \"\$CONTAINER_NAME\" || true
             exit 1"
