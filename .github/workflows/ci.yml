name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-branch-name:
    name: Check dev PR branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'

    steps:
      - name: Validate dev pull request branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          PATTERN='^(feat|fix|refactor|chore|docs|test|hotfix|release)/DU-[0-9]+$'

          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "::error::Invalid branch name: $BRANCH_NAME"
            echo "Branch name must match:"
            echo "  feat/DU-4"
            echo "Allowed prefixes: feat, fix, refactor, chore, docs, test, hotfix, release"
            exit 1
          fi

  main-branch-name:
    name: Check main PR branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Validate main pull request source branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [ "$BRANCH_NAME" != "dev" ]; then
            echo "::error::Invalid main PR source branch: $BRANCH_NAME"
            echo "main PRs must always be opened from dev."
            exit 1
          fi

  dev-build:
    name: Build and test dev
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.base_ref == 'dev'

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check code style
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build and run tests
        run: ./gradlew clean build --no-daemon

      - name: Verify Flyway migrations in JAR
        run: jar tf build/libs/*.jar | grep 'db/migration' | sort

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-dev
          path: build/reports/tests/test/
          if-no-files-found: ignore

  main-build:
    name: Build and test main
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.base_ref == 'main'

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check code style
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build and run tests
        run: ./gradlew clean build --no-daemon

      - name: Verify Flyway migrations in JAR
        run: jar tf build/libs/*.jar | grep 'db/migration' | sort

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-main
          path: build/reports/tests/test/
          if-no-files-found: ignore
