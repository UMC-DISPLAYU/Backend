services:
  mysql:
    image: mysql:8.4
    container_name: displayu-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: DisplayU
      MYSQL_USER: DisplayUser
      MYSQL_PASSWORD: "displayu2026!"
      MYSQL_ROOT_PASSWORD: "displayu2026!"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - displayu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uDisplayUser -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  displayu_mysql_data:
